<!DOCTYPE html>
<html>
<head>
    <title>Connection Animation Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .canvas { 
            position: relative; 
            width: 600px; 
            height: 400px; 
            border: 1px solid #ccc; 
            background: #f9f9f9;
        }
        .node { 
            position: absolute; 
            width: 80px; 
            height: 80px; 
            background: #3b82f6; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: bold;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }
        .selected { 
            box-shadow: 0 0 0 3px #10b981;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .node {
            z-index: 2;
        }
        .connection-line {
            stroke: #6b7280;
            stroke-width: 2.5;
            fill: none;
        }
    </style>
</head>
<body>
    <h1>Connection Animation Test</h1>
    <p>Click on nodes to select them. Connection lines should follow animated nodes in real-time.</p>
    
    <div class="canvas">
        <svg>
            <path id="connection" class="connection-line" />
        </svg>
        <div class="node" id="node1" style="left: 100px; top: 100px;" onclick="toggleSelect('node1')">Node 1</div>
        <div class="node" id="node2" style="left: 400px; top: 250px;" onclick="toggleSelect('node2')">Node 2</div>
    </div>

    <script>
        let selectedNodes = new Set();
        let animationFrame;
        let startTime = Date.now();

        function toggleSelect(nodeId) {
            const node = document.getElementById(nodeId);
            if (selectedNodes.has(nodeId)) {
                selectedNodes.delete(nodeId);
                node.classList.remove('selected');
            } else {
                selectedNodes.add(nodeId);
                node.classList.add('selected');
            }
            
            if (selectedNodes.size === 0) {
                cancelAnimationFrame(animationFrame);
                resetPositions();
            } else {
                animate();
            }
        }

        function resetPositions() {
            document.getElementById('node1').style.transform = 'translate(0px, 0px)';
            document.getElementById('node2').style.transform = 'translate(0px, 0px)';
            updateConnection(0, 0, 0, 0);
        }

        function animate() {
            const time = (Date.now() - startTime) * 0.002;
            
            let node1Offset = { x: 0, y: 0 };
            let node2Offset = { x: 0, y: 0 };
            
            if (selectedNodes.has('node1')) {
                node1Offset.x = Math.sin(time * 0.3) * 8;
                node1Offset.y = Math.cos(time * 0.21) * 6.4;
                document.getElementById('node1').style.transform = 
                    `translate(${node1Offset.x}px, ${node1Offset.y}px)`;
            }
            
            if (selectedNodes.has('node2')) {
                node2Offset.x = Math.sin(time * 0.3 + Math.PI/4) * 8;
                node2Offset.y = Math.cos(time * 0.21 + Math.PI/4) * 6.4;
                document.getElementById('node2').style.transform = 
                    `translate(${node2Offset.x}px, ${node2Offset.y}px)`;
            }
            
            updateConnection(node1Offset.x, node1Offset.y, node2Offset.x, node2Offset.y);
            animationFrame = requestAnimationFrame(animate);
        }

        function updateConnection(node1OffsetX, node1OffsetY, node2OffsetX, node2OffsetY) {
            const node1 = document.getElementById('node1');
            const node2 = document.getElementById('node2');
            
            const x1 = 100 + 40 + node1OffsetX; // center of node1
            const y1 = 100 + 40 + node1OffsetY;
            const x2 = 400 + 40 + node2OffsetX; // center of node2
            const y2 = 250 + 40 + node2OffsetY;
            
            // Simple bezier curve
            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2 - 50;
            
            const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
            document.getElementById('connection').setAttribute('d', path);
        }
    </script>
</body>
</html>
