<!DOCTYPE html>
<html>
<head>
    <title>Random Sine Wave Animation Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .canvas { 
            position: relative; 
            width: 800px; 
            height: 500px; 
            border: 1px solid #ccc; 
            background: #f9f9f9;
        }
        .node { 
            position: absolute; 
            width: 80px; 
            height: 80px; 
            background: #3b82f6; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: bold;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
            z-index: 2;
        }
        .selected { 
            box-shadow: 0 0 0 3px #10b981;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .connection-line {
            stroke: #6b7280;
            stroke-width: 2.5;
            fill: none;
        }
        .info {
            margin: 10px 0;
            padding: 10px;
            background: #e5f3ff;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Random Sine Wave Animation Test</h1>
    <div class="info">
        Click on nodes to select them. Each node will have its own random sine wave pattern with the same amplitude and speed constraints.
    </div>
    
    <div class="canvas">
        <svg>
            <path id="connection1" class="connection-line" />
            <path id="connection2" class="connection-line" />
        </svg>
        <div class="node" id="node1" style="left: 100px; top: 100px;" onclick="toggleSelect('node1')">Node 1</div>
        <div class="node" id="node2" style="left: 300px; top: 150px;" onclick="toggleSelect('node2')">Node 2</div>
        <div class="node" id="node3" style="left: 500px; top: 200px;" onclick="toggleSelect('node3')">Node 3</div>
        <div class="node" id="node4" style="left: 200px; top: 300px;" onclick="toggleSelect('node4')">Node 4</div>
    </div>

    <script>
        let selectedNodes = new Set();
        let animationFrame;
        let startTime = Date.now();
        let randomPhases = {};

        function generateRandomPhase(nodeId) {
            if (!randomPhases[nodeId]) {
                randomPhases[nodeId] = {
                    phaseX: Math.random() * Math.PI * 2, // Random phase for X (0 to 2π)
                    phaseY: Math.random() * Math.PI * 2, // Random phase for Y (0 to 2π)
                    freqX: 0.2 + Math.random() * 0.2, // Random frequency between 0.2-0.4 for X
                    freqY: 0.14 + Math.random() * 0.14, // Random frequency between 0.14-0.28 for Y
                };
                console.log(`Node ${nodeId}: phaseX=${randomPhases[nodeId].phaseX.toFixed(2)}, phaseY=${randomPhases[nodeId].phaseY.toFixed(2)}, freqX=${randomPhases[nodeId].freqX.toFixed(2)}, freqY=${randomPhases[nodeId].freqY.toFixed(2)}`);
            }
        }

        function toggleSelect(nodeId) {
            const node = document.getElementById(nodeId);
            if (selectedNodes.has(nodeId)) {
                selectedNodes.delete(nodeId);
                node.classList.remove('selected');
            } else {
                selectedNodes.add(nodeId);
                node.classList.add('selected');
                generateRandomPhase(nodeId); // Generate random phase for this node
            }
            
            if (selectedNodes.size === 0) {
                cancelAnimationFrame(animationFrame);
                resetPositions();
            } else {
                if (!animationFrame) {
                    animate();
                }
            }
        }

        function resetPositions() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`node${i}`).style.transform = 'translate(0px, 0px)';
            }
            updateConnections();
        }

        function animate() {
            const time = (Date.now() - startTime) * 0.002;
            
            const offsets = {};
            
            for (let i = 1; i <= 4; i++) {
                const nodeId = `node${i}`;
                if (selectedNodes.has(nodeId)) {
                    const phase = randomPhases[nodeId];
                    if (phase) {
                        // Use node-specific random phase and frequency
                        const x = Math.sin(time * phase.freqX + phase.phaseX) * 8;
                        const y = Math.cos(time * phase.freqY + phase.phaseY) * 6.4;
                        offsets[nodeId] = { x, y };
                        document.getElementById(nodeId).style.transform = 
                            `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
                    }
                } else {
                    offsets[nodeId] = { x: 0, y: 0 };
                }
            }
            
            updateConnections(offsets);
            animationFrame = requestAnimationFrame(animate);
        }

        function updateConnections(offsets = {}) {
            const node1 = document.getElementById('node1');
            const node2 = document.getElementById('node2');
            const node3 = document.getElementById('node3');
            const node4 = document.getElementById('node4');
            
            const offset1 = offsets['node1'] || { x: 0, y: 0 };
            const offset2 = offsets['node2'] || { x: 0, y: 0 };
            const offset3 = offsets['node3'] || { x: 0, y: 0 };
            const offset4 = offsets['node4'] || { x: 0, y: 0 };
            
            // Connection 1: Node 1 to Node 2
            const x1 = 100 + 40 + offset1.x;
            const y1 = 100 + 40 + offset1.y;
            const x2 = 300 + 40 + offset2.x;
            const y2 = 300 + 40 + offset2.y;
            const cx1 = (x1 + x2) / 2;
            const cy1 = (y1 + y2) / 2 - 50;
            const path1 = `M ${x1} ${y1} Q ${cx1} ${cy1} ${x2} ${y2}`;
            document.getElementById('connection1').setAttribute('d', path1);
            
            // Connection 2: Node 3 to Node 4
            const x3 = 500 + 40 + offset3.x;
            const y3 = 200 + 40 + offset3.y;
            const x4 = 200 + 40 + offset4.x;
            const y4 = 300 + 40 + offset4.y;
            const cx2 = (x3 + x4) / 2;
            const cy2 = (y3 + y4) / 2 - 50;
            const path2 = `M ${x3} ${y3} Q ${cx2} ${cy2} ${x4} ${y4}`;
            document.getElementById('connection2').setAttribute('d', path2);
        }
    </script>
</body>
</html>
