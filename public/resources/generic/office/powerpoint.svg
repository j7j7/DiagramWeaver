<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="powerpointGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D24726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Slide background -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="url(#powerpointGradient)" />
  
  <!-- Presentation screen -->
  <rect x="16" y="16" width="32" height="24" rx="1" fill="white" opacity="0.9" />
  
  <!-- Screen content -->
  <rect x="20" y="20" width="24" height="3" fill="#D24726" />
  <rect x="20" y="26" width="18" height="2" fill="#B91C1C" opacity="0.7" />
  <rect x="20" y="30" width="20" height="2" fill="#B91C1C" opacity="0.7" />
  <rect x="20" y="34" width="16" height="2" fill="#B91C1C" opacity="0.7" />
  
  <!-- Stand -->
  <rect x="30" y="40" width="4" height="8" fill="white" />
  <rect x="24" y="48" width="16" height="2" fill="white" />
</svg>