<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spreadsheetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Spreadsheet background -->
  <rect x="8" y="12" width="48" height="40" rx="2" fill="url(#spreadsheetGradient)" />
  
  <!-- Grid cells -->
  <g stroke="white" stroke-width="1" fill="none">
    <!-- Horizontal lines -->
    <line x1="8" y1="24" x2="56" y2="24" />
    <line x1="8" y1="36" x2="56" y2="36" />
    <line x1="8" y1="48" x2="56" y2="48" />
    
    <!-- Vertical lines -->
    <line x1="20" y1="12" x2="20" y2="52" />
    <line x1="32" y1="12" x2="32" y2="52" />
    <line x1="44" y1="12" x2="44" y2="52" />
  </g>
  
  <!-- Data visualization bars -->
  <rect x="10" y="38" width="8" height="12" fill="white" opacity="0.6" />
  <rect x="22" y="30" width="8" height="20" fill="white" opacity="0.6" />
  <rect x="34" y="34" width="8" height="16" fill="white" opacity="0.6" />
  <rect x="46" y="26" width="8" height="24" fill="white" opacity="0.6" />
</svg>