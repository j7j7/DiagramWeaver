<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="excelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#217346;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F5132;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Spreadsheet background -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="url(#excelGradient)" />
  
  <!-- Grid lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="white" stroke-width="1" />
  <line x1="12" y1="28" x2="52" y2="28" stroke="white" stroke-width="1" />
  <line x1="12" y1="36" x2="52" y2="36" stroke="white" stroke-width="1" />
  <line x1="12" y1="44" x2="52" y2="44" stroke="white" stroke-width="1" />
  
  <line x1="24" y1="8" x2="24" y2="56" stroke="white" stroke-width="1" />
  <line x1="36" y1="8" x2="36" y2="56" stroke="white" stroke-width="1" />
  <line x1="48" y1="8" x2="48" y2="56" stroke="white" stroke-width="1" />
  
  <!-- Header cell -->
  <rect x="12" y="8" width="12" height="12" fill="white" opacity="0.3" />
</svg>