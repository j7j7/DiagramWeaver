<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="outlookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Calendar background -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="url(#outlookGradient)" />
  
  <!-- Calendar header -->
  <rect x="12" y="8" width="40" height="12" fill="white" opacity="0.3" />
  
  <!-- Calendar rings -->
  <rect x="20" y="4" width="4" height="8" rx="2" fill="white" />
  <rect x="40" y="4" width="4" height="8" rx="2" fill="white" />
  
  <!-- Calendar grid -->
  <g stroke="white" stroke-width="1" fill="none">
    <line x1="12" y1="24" x2="52" y2="24" />
    <line x1="12" y1="32" x2="52" y2="32" />
    <line x1="12" y1="40" x2="52" y2="40" />
    <line x1="12" y1="48" x2="52" y2="48" />
    
    <line x1="23" y1="20" x2="23" y2="52" />
    <line x1="34" y1="20" x2="34" y2="52" />
    <line x1="45" y1="20" x2="45" y2="52" />
  </g>
  
  <!-- Email envelope overlay -->
  <rect x="28" y="28" width="20" height="14" rx="2" fill="white" opacity="0.8" />
  <path d="M28 28 L38 36 L48 28" stroke="#0078D4" stroke-width="1.5" fill="none" />
</svg>