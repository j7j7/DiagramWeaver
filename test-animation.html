<!DOCTYPE html>
<html>
<head>
    <title>Animation Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .node { 
            position: absolute; 
            width: 80px; 
            height: 80px; 
            background: #3b82f6; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: bold;
            transition: all 0.2s ease-in-out;
        }
        .selected { 
            box-shadow: 0 0 0 3px #10b981;
            animation: none; /* Override transition when selected */
        }
    </style>
</head>
<body>
    <h1>Node Animation Test</h1>
    <p>Click on nodes to select them and see the sine wave animation. Selected nodes should move smoothly in a circular pattern.</p>
    
    <div class="node" style="left: 50px; top: 50px;" onclick="toggleSelect(this)">Node 1</div>
    <div class="node" style="left: 200px; top: 50px;" onclick="toggleSelect(this)">Node 2</div>
    <div class="node" style="left: 350px; top: 50px;" onclick="toggleSelect(this)">Node 3</div>

    <script>
        let selectedNodes = new Set();
        let animationFrame;
        let startTime = Date.now();

        function toggleSelect(element) {
            if (selectedNodes.has(element)) {
                selectedNodes.delete(element);
                element.classList.remove('selected');
                element.style.transform = 'translate(0px, 0px)';
            } else {
                selectedNodes.add(element);
                element.classList.add('selected');
            }
            
            if (selectedNodes.size === 0) {
                cancelAnimationFrame(animationFrame);
                selectedNodes.forEach(node => {
                    node.style.transform = 'translate(0px, 0px)';
                });
            } else {
                animate();
            }
        }

        function animate() {
            const time = (Date.now() - startTime) * 0.002;
            
            selectedNodes.forEach(node => {
                const baseX = parseFloat(node.style.left);
                const baseY = parseFloat(node.style.top);
                
                const x = Math.sin(time * 0.3) * 8;
                const y = Math.cos(time * 0.21) * 6.4;
                
                node.style.transform = `translate(${x}px, ${y}px)`;
            });
            
            animationFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
